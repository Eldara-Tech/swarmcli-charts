      - series: 'rustfs_system_process_uptime_seconds{job="full_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="full",exported_job="RustFS",exported_instance="172.18.0.3",server="full-rustfs-1:9000"}'
        values: '600+60x34'
      - series: 'rustfs_cluster_capacity_free_bytes{job="full_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="full",exported_job="RustFS",exported_instance="172.18.0.3",collection_scope="cluster",observer="full-rustfs-1:9000"}'
        values: '5000000000x34'
      - series: 'rustfs_cluster_capacity_free_bytes{job="full_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="full",exported_job="RustFS",exported_instance="172.18.0.4",collection_scope="cluster",observer="full-rustfs-2:9000"}'
        values: '6000000000x34'
      - series: 'rustfs_cluster_capacity_usable_total_bytes{job="full_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="full",exported_job="RustFS",exported_instance="172.18.0.3",collection_scope="cluster",observer="full-rustfs-1:9000"}'
        values: '100000000000x34'
      - series: 'rustfs_cluster_capacity_usable_total_bytes{job="full_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="full",exported_job="RustFS",exported_instance="172.18.0.4",collection_scope="cluster",observer="full-rustfs-2:9000"}'
        values: '100000000000x34'

      # ioerr: peer 3 counts four drive errors at 15m; peer 1 none.
      - series: 'rustfs_system_process_uptime_seconds{job="ioerr_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ioerr",exported_job="RustFS",exported_instance="172.18.0.3",server="ioerr-rustfs-1:9000"}'
        values: '600+60x34'
      - series: 'rustfs_system_drive_availability_errors_total{job="ioerr_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ioerr",exported_job="RustFS",exported_instance="172.18.0.5",collection_scope="local",drive="/data/rustfs0",observer="ioerr-rustfs-3:9000",server="ioerr-rustfs-3:9000"}'
        values: '0x14 4x19'
      - series: 'rustfs_system_drive_availability_errors_total{job="ioerr_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ioerr",exported_job="RustFS",exported_instance="172.18.0.3",collection_scope="local",drive="/data/rustfs0",observer="ioerr-rustfs-1:9000",server="ioerr-rustfs-1:9000"}'
        values: '0x34'

    alert_rule_test:
      # Before any `for` has run out, nothing fires: start's forming set included.
      - eval_time: 7m
        alertname: RustFSWriteQuorumLost
        exp_alerts: []
      - eval_time: 7m
        alertname: RustFSReadQuorumLost
        exp_alerts: []
      - eval_time: 10m
        alertname: RustFSWriteQuorumAtRisk
        exp_alerts: []
      # single's offline drive is the standalone group's critical, from 5m.
      - eval_time: 10m
        alertname: RustFSDriveOffline
        exp_alerts:
          - exp_labels:
              severity: critical
              job: single_rustfs-metrics
              stack: single
            exp_annotations:
              summary: 'RustFS single has lost its drive'
              description: 'RustFS single has reported its drive offline for 5 minutes; it refuses every read and write until the drive is back.'

      # twodown and threedown below the write quorum, not onedown at it.
      - eval_time: 9m
        alertname: RustFSWriteQuorumLost
        exp_alerts:
          - exp_labels:
              mode: distributed
              severity: critical
              job: twodown_rustfs-distributed-metrics
              stack: twodown
              pool_id: "0"
              set_id: "0"
            exp_annotations:
              summary: 'RustFS twodown refuses writes'
              description: 'Erasure set 0 of pool 0 in RustFS twodown has had fewer drives online than its write quorum for 2 minutes; every write to it fails until enough peers are back.'
          - exp_labels:
              mode: distributed
              severity: critical
              job: threedown_rustfs-distributed-metrics
              stack: threedown
              pool_id: "0"
              set_id: "0"
            exp_annotations:
              summary: 'RustFS threedown refuses writes'
              description: 'Erasure set 0 of pool 0 in RustFS threedown has had fewer drives online than its write quorum for 2 minutes; every write to it fails until enough peers are back.'
      # Only threedown below the read quorum.
      - eval_time: 9m
        alertname: RustFSReadQuorumLost
        exp_alerts:
          - exp_labels:
              mode: distributed
              severity: critical
              job: threedown_rustfs-distributed-metrics
              stack: threedown
              pool_id: "0"
              set_id: "0"
            exp_annotations:
              summary: 'RustFS threedown cannot serve reads'
              description: 'Erasure set 0 of pool 0 in RustFS threedown has had fewer drives online than its read quorum for 2 minutes; objects in it cannot be read until enough peers are back.'
      # Only onedown at the write quorum, while its stopped peer's stale healthy view is still
      # in the collector (until 10m) and after; not single's one drive, under the other job.
      - eval_time: 12m
        alertname: RustFSWriteQuorumAtRisk
        exp_alerts:
          - exp_labels:
              mode: distributed
              severity: critical
              job: onedown_rustfs-distributed-metrics
              stack: onedown
              pool_id: "0"
              set_id: "0"
            exp_annotations:
              summary: 'RustFS onedown is one failure from refusing writes'
              description: 'Erasure set 0 of pool 0 in RustFS onedown has had exactly its write quorum of drives online for 5 minutes: losing one more drive or peer stops every write to it.'
      - eval_time: 20m
        alertname: RustFSWriteQuorumAtRisk
        exp_alerts:
          - exp_labels:
              mode: distributed
              severity: critical
              job: onedown_rustfs-distributed-metrics
              stack: onedown
              pool_id: "0"
              set_id: "0"
            exp_annotations:
              summary: 'RustFS onedown is one failure from refusing writes'
              description: 'Erasure set 0 of pool 0 in RustFS onedown has had exactly its write quorum of drives online for 5 minutes: losing one more drive or peer stops every write to it.'
      # Every release with a peer down, as a warning; single's offline drive only as the
      # standalone group's critical.
      - eval_time: 12m
        alertname: RustFSDriveOffline
        exp_alerts:
          - exp_labels:
              severity: critical
              job: single_rustfs-metrics
              stack: single
            exp_annotations:
              summary: 'RustFS single has lost its drive'
              description: 'RustFS single has reported its drive offline for 5 minutes; it refuses every read and write until the drive is back.'
          - exp_labels:
              mode: distributed
              severity: warning
              job: onedown_rustfs-distributed-metrics
              stack: onedown
            exp_annotations:
              summary: 'RustFS onedown has drives offline'
              description: 'RustFS onedown has had drives offline for 5 minutes, 1 at the last count: a peer is down or a drive has failed (docker stack ps onedown).'
          - exp_labels:
              mode: distributed
              severity: warning
              job: twodown_rustfs-distributed-metrics
              stack: twodown
            exp_annotations:
              summary: 'RustFS twodown has drives offline'
              description: 'RustFS twodown has had drives offline for 5 minutes, 2 at the last count: a peer is down or a drive has failed (docker stack ps twodown).'
          - exp_labels:
              mode: distributed
              severity: warning
              job: threedown_rustfs-distributed-metrics
              stack: threedown
            exp_annotations:
              summary: 'RustFS threedown has drives offline'
              description: 'RustFS threedown has had drives offline for 5 minutes, 3 at the last count: a peer is down or a drive has failed (docker stack ps threedown).'

      # Only silent, and not before its series have been gone for 10 minutes: the last
      # sample at 5m is still in the 5-minute lookback until 10m. single is the standalone
      # group's, which sees no uptime from it at all.
      - eval_time: 19m
        alertname: RustFSNotReporting
        exp_alerts:
          - exp_labels:
              severity: critical
              job: single_rustfs-metrics
              stack: single
            exp_annotations:
              summary: 'RustFS single has stopped reporting metrics'
              description: 'single_rustfs-metrics is up but has received no metrics from RustFS for 15 minutes: the RustFS task is down or restarting, or its OTLP export failed (docker service logs single_rustfs).'
      - eval_time: 21m
        alertname: RustFSNotReporting
        exp_alerts:
          - exp_labels:
              severity: critical
              job: single_rustfs-metrics
              stack: single
            exp_annotations:
              summary: 'RustFS single has stopped reporting metrics'
              description: 'single_rustfs-metrics is up but has received no metrics from RustFS for 15 minutes: the RustFS task is down or restarting, or its OTLP export failed (docker service logs single_rustfs).'
          - exp_labels:
              mode: distributed
              severity: critical
              job: silent_rustfs-distributed-metrics
              stack: silent
            exp_annotations:
              summary: 'RustFS silent has stopped reporting metrics'
              description: 'silent_rustfs-distributed-metrics is up but has received no metrics from any RustFS peer for 15 minutes: every peer is down or restarting, or their OTLP export failed (docker service logs silent_rustfs-1).'
      # Not ok's 1%.
      - eval_time: 12m
        alertname: RustFSS3ServerErrors
        exp_alerts:
          - exp_labels:
              mode: distributed
              severity: critical
              job: errors_rustfs-distributed-metrics
              stack: errors
            exp_annotations:
              summary: 'RustFS errors is failing requests'
              description: '10% of the requests RustFS errors answered in the last 5 minutes, health checks and console included, were 5xx.'
      - eval_time: 17m
        alertname: RustFSCapacityLow
        exp_alerts:
          - exp_labels:
              mode: distributed
              severity: warning
              job: full_rustfs-distributed-metrics
              stack: full
            exp_annotations:
              summary: 'RustFS full is running out of space'
              description: 'RustFS full has 5% of its usable capacity free.'
      # Peer 3 only, and not ok's errors from long ago; they stop counting once out of the window.
      - eval_time: 20m
        alertname: RustFSDriveIOErrors
        exp_alerts:
          - exp_labels:
              mode: distributed
              severity: warning
              job: ioerr_rustfs-distributed-metrics
              stack: ioerr
              server: ioerr-rustfs-3:9000
            exp_annotations:
              summary: 'RustFS ioerr peer ioerr-rustfs-3:9000 is getting errors from its drives'
              description: 'Peer ioerr-rustfs-3:9000 of RustFS ioerr counted 4 I/O errors or timeouts on its drives in the last 15 minutes.'
      - eval_time: 31m
        alertname: RustFSDriveIOErrors
        exp_alerts: []
