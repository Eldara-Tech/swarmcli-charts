name: Release Chart

# Two ways in, one release path:
#
#   - push a tag `<chart>/v<version>` (the original flow, unchanged), or
#   - run this workflow with a chart + bump, and it derives the next version from
#     the newest existing tag and creates the tag itself.
#
# The dispatch path exists because GitHub silently DROPS tag-push events beyond 3
# tags in a single `git push`. Releasing several charts after one grouped Renovate
# PR would therefore leave some charts tagged but never published. One dispatch is
# always exactly one release. The tag is still the source of truth for the version
# either way — the dispatch just computes it and lets the release API create it.
on:
  push:
    tags:
      - '*/v*'
  workflow_dispatch:
    inputs:
      chart:
        description: Chart to release
        required: true
        type: string
      bump:
        description: Version bump, applied to the newest existing <chart>/v* tag
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Release notes are derived from the commits touching this chart since
          # its previous tag, so the job needs full history and every tag.
          fetch-depth: 0

      - name: Resolve chart and version
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          IN_CHART: ${{ inputs.chart }}
          IN_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG=${GITHUB_REF#refs/tags/}
            CHART=${TAG%%/*}
            VERSION=${TAG#*/}
          else
            CHART="$IN_CHART"
            PREV=$(git tag --list "${CHART}/v*" --sort=-v:refname | head -1)
            if [ -z "$PREV" ]; then
              # First release of a chart: start the series rather than bumping nothing.
              NEXT="0.1.0"
            else
              CUR=${PREV#"${CHART}"/v}
              IFS=. read -r MA MI PA <<<"$CUR"
              case "$IN_BUMP" in
                major) NEXT="$((MA + 1)).0.0" ;;
                minor) NEXT="${MA}.$((MI + 1)).0" ;;
                patch) NEXT="${MA}.${MI}.$((PA + 1))" ;;
              esac
            fi
            VERSION="v${NEXT}"
            TAG="${CHART}/${VERSION}"
          fi
          SEMVER=${VERSION#v}                       # Helm/SemVer form, no leading "v"
          {
            echo "chart=$CHART"
            echo "version=$VERSION"
            echo "semver=$SEMVER"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Verify chart directory exists
        run: |
          if [ ! -d "charts/${{ steps.parse.outputs.chart }}" ]; then
            echo "ERROR: charts/${{ steps.parse.outputs.chart }} does not exist"
            exit 1
          fi

      # On the dispatch path the tag does not exist yet and the release API will
      # create it. Refuse to clobber one that somehow already does.
      - name: Verify the release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.parse.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ERROR: release ${{ steps.parse.outputs.tag }} already exists"
            exit 1
          fi

      - name: Set chart version from tag
        run: |
          # The git tag is the source of truth: stamp its SemVer into Chart.yaml
          # so the packaged metadata matches the tag and the published index entry.
          sed -i -E "s/^version:.*/version: ${{ steps.parse.outputs.semver }}/" \
            charts/${{ steps.parse.outputs.chart }}/Chart.yaml
          grep '^version:' charts/${{ steps.parse.outputs.chart }}/Chart.yaml

      - name: Package chart
        id: package
        run: |
          FILENAME="${{ steps.parse.outputs.chart }}-${{ steps.parse.outputs.version }}.tgz"
          tar -czf "$FILENAME" -C charts ${{ steps.parse.outputs.chart }}
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Generate checksum
        run: |
          sha256sum ${{ steps.package.outputs.filename }} > ${{ steps.package.outputs.filename }}.sha256
          cat ${{ steps.package.outputs.filename }}.sha256

      # Renovate resolves these notes for anyone consuming the chart downstream —
      # its release matcher `(?:^|/)(?:<dep>)[@_/-]v?<version>` matches our
      # `<chart>/v<version>` tags — so whatever lands here is the changelog a
      # downstream bump PR shows. Boilerplate was being rendered as the changelog.
      - name: Build release notes
        id: notes
        env:
          CHART: ${{ steps.parse.outputs.chart }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          set -euo pipefail
          PREV=$(git tag --list "${CHART}/v*" --sort=-v:refname | grep -vFx "$TAG" | head -1 || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            HEADING="Changes since ${PREV#"${CHART}"/}"
          else
            RANGE="HEAD"
            HEADING="Changes"
          fi
          CHANGES=$(git log --no-merges --pretty='- %s (%h)' "$RANGE" -- "charts/${CHART}" || true)
          [ -z "$CHANGES" ] && CHANGES="- Initial release."
          {
            echo "body<<NOTES_EOF"
            echo "### ${HEADING}"
            echo
            echo "$CHANGES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ steps.parse.outputs.tag }}
          name: "${{ steps.parse.outputs.chart }} ${{ steps.parse.outputs.version }}"
          body: |
            ## ${{ steps.parse.outputs.chart }} ${{ steps.parse.outputs.version }}

            ${{ steps.notes.outputs.body }}

            Install with SwarmCLI:
            ```bash
            swarmcli charts install ${{ steps.parse.outputs.chart }} swarmcli-charts/${{ steps.parse.outputs.chart }} --version ${{ steps.parse.outputs.semver }}
            ```
          files: |
            ${{ steps.package.outputs.filename }}
            ${{ steps.package.outputs.filename }}.sha256

  # Publish the regenerated index to the live GitHub Pages site. Pages on this
  # repo is configured with build_type=workflow, so it serves the artifact
  # uploaded here — NOT the gh-pages branch. A prior revision pushed to the
  # gh-pages branch instead, which is inert under this Pages config and silently
  # froze the served index. We deploy the uploaded artifact through the Pages REST
  # deployment API below — the same workflow-build mechanism actions/deploy-pages
  # wraps, but with a per-run build version so same-commit releases don't dedupe.
  update-index:
    needs: release
    runs-on: ubuntu-latest
    # Serialise index deploys so overlapping runs don't churn the Pages API. Losing
    # a race no longer matters: each deploy carries a per-run pages_build_version
    # (see the deploy step), so charts released at the SAME commit can't collide on
    # one deployment id and drop the fuller index — that was #89, fixed there.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write        # create the Pages deployment
      id-token: write     # mint the OIDC token the deployment API requires
      actions: read       # look up the uploaded artifact's id via the REST API
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # need full history/tags so `git show <tag>:path` works

      - name: Generate index.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/generate-index.sh
          mkdir -p public
          ./scripts/generate-index.sh "${{ github.repository }}" > public/index.yaml
          echo "=== Generated index.yaml ==="
          cat public/index.yaml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

      # actions/deploy-pages hardcodes pages_build_version to GITHUB_SHA, and Pages
      # keeps only the FIRST deployment for a given build version — so every chart
      # released at one commit deploys the same SHA and only the earliest (partial)
      # index survives (#89). Deploy through the Pages REST API directly with a
      # per-RUN build version instead, so no two index deploys ever dedupe and the
      # last run (which sees every release) always wins.
      - name: Deploy index to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # The artifact upload-pages-artifact just created (named "github-pages"),
          # scoped to this run.
          ARTIFACT_ID=$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            -q '.artifacts[] | select(.name == "github-pages") | .id' | head -n1)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: no github-pages artifact found for run ${GITHUB_RUN_ID}" >&2
            exit 1
          fi

          # The deployment API requires an OIDC token, minted with the default
          # audience exactly as deploy-pages does via core.getIDToken().
          OIDC_TOKEN=$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: could not mint an OIDC token (need id-token: write)" >&2
            exit 1
          fi

          # Per-run and thus unique even across charts sharing one commit.
          BUILD_VERSION="${GITHUB_SHA}-${GITHUB_RUN_ID}"

          STATUS_URL=$(gh api -X POST "repos/${REPO}/pages/deployments" \
            -F "artifact_id=${ARTIFACT_ID}" \
            -f "pages_build_version=${BUILD_VERSION}" \
            -f "oidc_token=${OIDC_TOKEN}" \
            -q '.status_url')
          echo "Created Pages deployment ${BUILD_VERSION} (artifact ${ARTIFACT_ID})"

          # Wait for it to go live so a server-side failure fails the job.
          for _ in $(seq 1 60); do
            STATUS=$(gh api "${STATUS_URL}" -q '.status' 2>/dev/null || true)
            echo "deployment status: ${STATUS:-<pending>}"
            case "${STATUS}" in
              succeed)
                echo "Index deployed."
                exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_attempt_error|deployment_lost)
                echo "ERROR: Pages deployment ended in status '${STATUS}'" >&2
                exit 1 ;;
            esac
            sleep 5
          done
          echo "ERROR: timed out after 5m waiting for the Pages deployment" >&2
          exit 1
