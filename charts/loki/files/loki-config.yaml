# Loki configuration shipped by this chart and mounted as a Swarm config at
# /etc/loki/loki-config.yaml.
#
# It carries the STRUCTURE of a single-binary, filesystem-backed Loki — schema,
# storage, ring, compactor. The knobs an operator turns (retention on/off and for
# how long, log level, usage reporting) are NOT here: values.yaml renders them as
# command-line flags, which take precedence over this file, so one file serves
# every release. Anything neither this file nor a value covers goes in extraArgs,
# and a deployment that needs a different shape entirely (S3, multi-tenancy)
# replaces this file wholesale via config.mode — see the chart README.
#
# Do not edit this file expecting a deployed release to pick it up: Swarm config
# data is immutable, so the rendered config object is named after the chart
# version and a changed file only reaches a swarm through a chart release.

# Single-tenant. auth_enabled: true does NOT add authentication — it makes Loki
# require an X-Scope-OrgID header on every request and partitions data by it.
# Loki has no authentication of its own in any mode; see the README.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  # The single binary talks to itself; the ring below is in-memory, so there is
  # no peer to advertise a routable address to.
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # tsdb + v13 is the current schema. The 24h index period is not cosmetic:
    # retention is only applied for periodic tables, so a different period
    # silently disables the compactor's retention pass.
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  # Required whenever retention is enabled (-compactor.retention-enabled, which
  # retention.enabled in values.yaml renders): Loki refuses to start with
  # retention on and no delete-request store. Filesystem, to match the chunks.
  delete_request_store: filesystem

limits_config:
  # retention_period is deliberately absent — retention.period renders it as
  # -store.retention so the value stays in values.yaml with the on/off switch.
  #
  # Ingestion is capped so one runaway container cannot fill the data volume
  # ahead of the compactor. Both are per-tenant and raisable via extraArgs
  # (-distributor.ingestion-rate-limit-mb / -distributor.ingestion-burst-size-mb).
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

# Loki reports anonymous usage and configuration statistics to Grafana Labs by
# default. Off here, and analytics.enabled in values.yaml renders the flag that
# turns it back on for anyone who wants to contribute them.
analytics:
  reporting_enabled: false
