# The console routed through the in-repo traefik chart as a real edge while the S3 API
# stays on rustfs-net (exposure.mode none): a browser reaches the console, and port 9000
# is reachable by nothing outside the overlay. ci/e2e-setup.sh stands the edge up. Plain
# HTTP (tls:false): CI cannot issue an ACME certificate.
console:
  enabled: true
  exposure:
    mode: traefik
  ingress:
    host: rustfs-console.e2e.test
    tls: false
