# ai-backend fixture: the Zammad app tier joined to a co-located, port-unexposed AI backend.
# aiBackend.enabled attaches every app role to aiBackend.network (the EXTERNAL overlay the backend —
# e.g. an in-swarm Ollama whose port is not published — lives on) so Zammad can dial it BY SERVICE
# NAME. This is network reachability ONLY; pointing Zammad at the provider is a config step
# (Admin → System → AI: base URL such as http://ollama:11434 + token, stored in the DB), never env.
# render-check.sh asserts the overlay renders external:true and that railsserver joined it.
# Regression guard for swarmcli-charts#82 (the local-Ollama request on the Zammad chart PR).
aiBackend:
  enabled: true
  network: eldara-ollama_ai-internal
