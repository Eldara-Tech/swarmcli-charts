# promtool unit tests for monitoring/harbor-rules.yml, which the chart ships for operators to
# load into their Prometheus but does not deploy itself. ci/e2e-check.sh runs them with a
# pinned prom/prometheus image's promtool in the metrics case.
#
# One release per failure. Two must raise nothing: `ok` serves traffic with 1% of it 5xx
# from core and from the registry, has an empty job queue, a project at half its quota and
# one without a quota (-1); `other` is another stack's service that happens to be named
# `exporter`, with no Harbor series, and a non-Harbor job answering nothing but 5xx.
rule_files:
  - ../monitoring/harbor-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # Every release's exporter answers throughout.
      - series: 'up{job="ok_exporter",instance="10.0.9.5:8001",stack="ok"}'
        values: '1x35'
      - series: 'up{job="coredown_exporter",instance="10.0.1.5:8001",stack="coredown"}'
        values: '1x35'
      - series: 'up{job="other_exporter",instance="10.0.8.5:8001",stack="other"}'
        values: '1x35'

      # ok: healthy under load.
      - series: 'harbor_task_scheduled_total{job="ok_exporter",instance="10.0.9.5:8001",stack="ok"}'
        values: '3x35'
      - series: 'harbor_health{job="ok_exporter",instance="10.0.9.5:8001",stack="ok"}'
        values: '1x35'
      - series: 'harbor_up{job="ok_exporter",instance="10.0.9.5:8001",stack="ok",component="core"}'
        values: '1x35'
      - series: 'harbor_up{job="ok_exporter",instance="10.0.9.5:8001",stack="ok",component="database"}'
        values: '1x35'
      - series: 'harbor_up{job="ok_exporter",instance="10.0.9.5:8001",stack="ok",component="trivy"}'
        values: '1x35'
      - series: 'harbor_core_http_request_total{job="ok_core",instance="10.0.9.6:8001",stack="ok",method="GET",code="200",operation="getHealth"}'
        values: '0+99x35'
      - series: 'harbor_core_http_request_total{job="ok_core",instance="10.0.9.6:8001",stack="ok",method="GET",code="500",operation="v2_manifest"}'
        values: '0+1x35'
      - series: 'registry_http_requests_total{job="ok_registry",instance="10.0.9.7:8001",stack="ok",method="get",handler="blob",code="200"}'
        values: '0+99x35'
      - series: 'registry_http_requests_total{job="ok_registry",instance="10.0.9.7:8001",stack="ok",method="get",handler="blob",code="503"}'
        values: '0+1x35'
      - series: 'harbor_task_queue_latency{job="ok_exporter",instance="10.0.9.5:8001",stack="ok",type="GARBAGE_COLLECTION"}'
        values: '0x35'
      - series: 'harbor_task_queue_latency{job="ok_exporter",instance="10.0.9.5:8001",stack="ok",type="IMAGE_SCAN"}'
        values: '30x35'
      - series: 'harbor_project_quota_usage_byte{job="ok_exporter",instance="10.0.9.5:8001",stack="ok",project_name="half"}'
        values: '50000000000x35'
      - series: 'harbor_project_quota_byte{job="ok_exporter",instance="10.0.9.5:8001",stack="ok",project_name="half"}'
        values: '100000000000x35'
      - series: 'harbor_project_quota_usage_byte{job="ok_exporter",instance="10.0.9.5:8001",stack="ok",project_name="unlimited"}'
        values: '900000000000x35'
      - series: 'harbor_project_quota_byte{job="ok_exporter",instance="10.0.9.5:8001",stack="ok",project_name="unlimited"}'
        values: '-1x35'

      # other: none of these alerts' business.
      - series: 'registry_http_requests_total{job="other_web",instance="10.0.8.6:5000",stack="other",method="get",handler="blob",code="500"}'
        values: '0+10x35'

      # coredown: core stops answering the exporter at 5m; the exporter keeps reading the queue.
      - series: 'harbor_task_scheduled_total{job="coredown_exporter",instance="10.0.1.5:8001",stack="coredown"}'
        values: '3x35'
      - series: 'harbor_health{job="coredown_exporter",instance="10.0.1.5:8001",stack="coredown"}'
        values: '1x4 _x31'

      # dbdown: the database goes away at 2m.
      - series: 'harbor_up{job="dbdown_exporter",instance="10.0.2.5:8001",stack="dbdown",component="core"}'
        values: '1x35'
      - series: 'harbor_up{job="dbdown_exporter",instance="10.0.2.5:8001",stack="dbdown",component="database"}'
        values: '1 1 0x33'

      # trivydown: the scanner goes away at 2m.
      - series: 'harbor_up{job="trivydown_exporter",instance="10.0.3.5:8001",stack="trivydown",component="registry"}'
        values: '1x35'
      - series: 'harbor_up{job="trivydown_exporter",instance="10.0.3.5:8001",stack="trivydown",component="trivy"}'
        values: '1 1 0x33'

      # errors: a tenth of core's requests answer 5xx.
      - series: 'harbor_core_http_request_total{job="errors_core",instance="10.0.4.6:8001",stack="errors",method="GET",code="200",operation="getHealth"}'
        values: '0+90x35'
      - series: 'harbor_core_http_request_total{job="errors_core",instance="10.0.4.6:8001",stack="errors",method="PUT",code="502",operation="v2_blob_upload"}'
        values: '0+10x35'

      # regerr: a tenth of the registry's requests answer 5xx.
      - series: 'registry_http_requests_total{job="regerr_registry",instance="10.0.5.7:8001",stack="regerr",method="put",handler="blob_upload",code="201"}'
        values: '0+90x35'
      - series: 'registry_http_requests_total{job="regerr_registry",instance="10.0.5.7:8001",stack="regerr",method="put",handler="blob_upload",code="500"}'
        values: '0+10x35'

      # stalled: replication jobs wait two hours from 2m on, and keep waiting.
      - series: 'harbor_task_queue_latency{job="stalled_exporter",instance="10.0.6.5:8001",stack="stalled",type="REPLICATION"}'
        values: '0 0 7200+60x33'

      # quota: a project at 95% of its quota.
      - series: 'harbor_project_quota_usage_byte{job="quota_exporter",instance="10.0.7.5:8001",stack="quota",project_name="full"}'
        values: '95000000000x35'
      - series: 'harbor_project_quota_byte{job="quota_exporter",instance="10.0.7.5:8001",stack="quota",project_name="full"}'
        values: '100000000000x35'

    alert_rule_test:
      # Before any `for` has run out, nothing fires.
      - eval_time: 4m
        alertname: HarborCoreUnreachable
        exp_alerts: []
      - eval_time: 6m
        alertname: HarborComponentDown
        exp_alerts: []
      - eval_time: 11m
        alertname: HarborComponentDegraded
        exp_alerts: []
      - eval_time: 9m
        alertname: HarborCoreServerErrors
        exp_alerts: []
      - eval_time: 9m
        alertname: HarborRegistryServerErrors
        exp_alerts: []
      - eval_time: 16m
        alertname: HarborJobQueueStalled
        exp_alerts: []
      - eval_time: 14m
        alertname: HarborProjectQuotaNearlyFull
        exp_alerts: []

      # Only coredown, not before its last health sample has left the 5-minute lookback (9m)
      # and the 5 minutes after it; not `other`, whose exporter reports no Harbor queue.
      - eval_time: 12m
        alertname: HarborCoreUnreachable
        exp_alerts: []
      - eval_time: 16m
        alertname: HarborCoreUnreachable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: coredown_exporter
              stack: coredown
            exp_annotations:
              summary: 'Harbor coredown core does not answer'
              description: 'coredown_exporter has not reached core''s health API for 5 minutes: the UI, the API and every push and pull go through core (docker service logs coredown_core).'
      # The database, not trivydown's scanner.
      - eval_time: 8m
        alertname: HarborComponentDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: dbdown_exporter
              stack: dbdown
              component: database
            exp_annotations:
              summary: 'Harbor dbdown: database is down'
              description: 'Harbor dbdown has reported database unhealthy for 5 minutes; pushes, pulls or the UI fail while it is.'
      - eval_time: 13m
        alertname: HarborComponentDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              job: trivydown_exporter
              stack: trivydown
              component: trivy
            exp_annotations:
              summary: 'Harbor trivydown: trivy is down'
              description: 'Harbor trivydown has reported trivy unhealthy for 10 minutes. Pushes and pulls still work; its background jobs or scans do not.'
      # Not ok's 1%.
      - eval_time: 12m
        alertname: HarborCoreServerErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              job: errors_core
              stack: errors
            exp_annotations:
              summary: 'Harbor errors core is failing requests'
              description: '10% of the requests Harbor errors core answered in the last 5 minutes were 5xx.'
      # Not ok's 1%, nor other_web's 5xx.
      - eval_time: 12m
        alertname: HarborRegistryServerErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              job: regerr_registry
              stack: regerr
            exp_annotations:
              summary: 'Harbor regerr registry is failing requests'
              description: '10% of the requests the Harbor regerr registry answered in the last 5 minutes were 5xx; check its storage (docker service logs regerr_registry).'
      # Not ok's empty or briefly waiting queues.
      - eval_time: 18m
        alertname: HarborJobQueueStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: stalled_exporter
              stack: stalled
              type: REPLICATION
            exp_annotations:
              summary: 'Harbor stalled: REPLICATION jobs are not being picked up'
              description: 'The oldest REPLICATION job of Harbor stalled has waited 2h 16m 0s for a worker.'
      # Not ok's half-full project, nor its unlimited one.
      - eval_time: 16m
        alertname: HarborProjectQuotaNearlyFull
        exp_alerts:
          - exp_labels:
              severity: warning
              job: quota_exporter
              stack: quota
              project_name: full
            exp_annotations:
              summary: 'Harbor quota: project full is near its quota'
              description: 'Project full of Harbor quota has used 95% of its storage quota; at 100% Harbor refuses pushes to it.'
