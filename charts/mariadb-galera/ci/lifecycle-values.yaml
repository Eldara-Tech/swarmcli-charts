# Lifecycle: the operations a long-lived cluster goes through, driven by
# ci/e2e-check.sh in a CI job of its own (.github/e2e-matrix.yaml): a peer restart, a
# peer rebuilt from an empty volume, an upgrade rolling every peer, every peer stopped
# together, a peer lost for good and recovered with cluster.forceBootstrap, a
# crash of every peer, and a peer replaced while its old container still runs.
# Shorter health windows than
# the defaults, so each rollout's monitor window costs 2.5 minutes rather than 6;
# the dataset is tiny, so a state transfer fits in them easily.
healthcheck:
  startPeriod: 90s
  monitor: 150s
# Past the minute a Swarm update waits for the old task before starting the new one,
# so a frozen old container overlaps its replacement for about 30s, and short enough
# that the step does not wait out the default 5m.
stopGracePeriod: 90s
# Peer 1, rebuilt from an empty volume, pulls a full state transfer under this, and
# ci/e2e-check.sh reads the buffer pool size back on every peer. The `$` in the
# comment line must reach the file as written.
extraConfig: |
  [mysqld]
  # escaping check: a literal $ survives compose
  innodb_buffer_pool_size = 256M
