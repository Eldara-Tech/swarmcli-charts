        values: '600+60x34'
      - series: 'rustfs_cluster_erasure_set_online_drives_count{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.5",collection_scope="cluster",observer="ok-rustfs-3:9000",pool_id="0",set_id="0"}'
        values: '4x34'
      - series: 'rustfs_cluster_erasure_set_write_quorum{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.5",collection_scope="cluster",observer="ok-rustfs-3:9000",pool_id="0",set_id="0"}'
        values: '3x34'
      - series: 'rustfs_cluster_erasure_set_write_health{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.5",collection_scope="cluster",observer="ok-rustfs-3:9000",pool_id="0",set_id="0"}'
