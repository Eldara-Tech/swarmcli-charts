# The e2e fixture for oauth2-proxy and the bundled S3 store: ci/e2e-setup.sh stands up a
# throwaway PostgreSQL and an OIDC discovery mock for oauth2-proxy; storage.endpoint is left
# empty, so the chart's own RustFS serves S3 (noauth and login use the external SeaweedFS).
database:
  host: airbyte-e2e-postgres
oauth2:
  issuerUrl: http://airbyte-e2e-oidc:8080/realms/airbyte
