name: E2E

# Deploys the chart to a REAL (throwaway, single-node) Docker Swarm and asserts it runs —
# the loop scripts/e2e-test.sh drives locally via `make e2e`, now also in CI. Unlike the
# data-only Charts workflow (which only renders), this proves the stack converges, serves,
# and — for the openclaw backend fixture — that the gateway actually reaches its configured
# model backend (the regression guard for #60).
#
# It stays fork-safe like the other workflows: it uses only public images and dummy secrets
# created on the runner by each chart's ci/e2e-setup.sh (E2E_SWARM_INIT=1 stands up the
# throwaway swarm), never a repo secret, with a read-only token.
#
# Scoped to the openclaw chart for now — the only chart shipping CI-provisionable setup
# hooks. Add more charts to the run below as they gain ci/e2e-setup.sh (or converge solo).
#
# Triggers on every PR but a change-detection job skips the heavy run when no chart/script
# files changed; a skipped required check counts as passing, so this can be a required check
# without hanging unrelated PRs.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Pushes always run; PRs run only when a chart source or the e2e machinery
          # changed, so the required check is enforced iff relevant files changed (and
          # reports skipped = pass otherwise).
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || git diff --name-only HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(charts/|scripts/|Makefile|\.github/workflows/e2e\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No chart/script changes; skipping e2e."
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      # swarmcli is the chart client; its charts CLI is only on main today, so build it
      # from source (same as the Charts workflow).
      - name: Build swarmcli
        run: scripts/install-swarmcli.sh "$PWD/.swarmcli-bin"

      # Deploy each openclaw fixture to a throwaway single-node swarm, converge, smoke-test,
      # and tear down. E2E_SWARM_INIT=1 initialises the swarm; the chart's ci/e2e-setup.sh
      # provisions the dummy secret / node label / mock backend. A generous timeout absorbs
      # the openclaw image pull (>=2 GB, 120s health start period).
      - name: Deploy + verify (openclaw)
        run: |
          SWARMCLI="$PWD/.swarmcli-bin/swarmcli" \
          E2E_SWARM_INIT=1 \
          E2E_TIMEOUT=10m \
          scripts/e2e-test.sh openclaw
