# GitLab alerts for the web metrics server metrics.enabled turns on, or any target serving
# GitLab's Rails metrics. The chart does not deploy them: hand the file to your Prometheus,
# e.g. the prometheus-stack chart's prometheus.extraRules (README § Alerts and a dashboard).
# Both are derived from the gitlab-mixin in grafana/jsonnet-libs (Apache-2.0), and both
# differ from it where it misses on GitLab 19. http_requests_total's status label is a
# class ("5xx"), not a code, so upstream's 5xx ratio never matches; and upstream's runner
# ratio cannot hold for 5 minutes, because a runner refused three times backs off an hour.
# Severity: critical only when users lose service now (5xx from GitLab itself); a refused
# runner is a warning. Grouped by (stack, job): one alert per release.
#
# Validate (from the repo root):
#   docker run --rm --entrypoint promtool -v "$PWD/charts/gitlab:/chart:ro" \
#     "prom/prometheus:$(sed -n 's/^appVersion: *"\(.*\)"$/\1/p' charts/prometheus-stack/Chart.yaml)" \
#     test rules /chart/ci/gitlab-rules-test.yml
groups:
  - name: gitlab
    rules:
      # Health checks are counted elsewhere (http_health_requests_total), so they neither
      # dilute the ratio nor keep it defined on an idle instance.
      - alert: GitLabHigh5xxResponses
        expr: |
          sum by (stack, job) (rate(http_requests_total{status="5xx"}[5m]))
            / sum by (stack, job) (rate(http_requests_total[5m]))
          > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'GitLab {{ $labels.stack }} is answering with server errors'
          description: '{{ $value | humanizePercentage }} of the requests to {{ $labels.job }} have returned a 5xx status for 5 minutes.'
      # A runner presents a token GitLab does not know: the runner was deleted or its token
      # reset in GitLab. gitlab-runner stops asking after three refusals and tries again an
      # hour later, so refusals arrive in hourly bursts; the 65m window outlasts the back-off
      # and keeps the alert firing between them. When they are GitLab's first refusals since
      # it started, the counter appears with them and increase() sees only the next burst,
      # up to an hour later.
      - alert: GitLabHighRunnerAuthFailure
        expr: sum by (stack, job) (increase(gitlab_ci_runner_authentication_failure_total[65m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'GitLab {{ $labels.stack }} is refusing a runner token'
          description: '{{ $labels.job }} has refused a runner authentication in the last 65 minutes: a runner presents a token GitLab does not know.'
