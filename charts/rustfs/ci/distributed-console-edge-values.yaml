# The console routed through the in-repo traefik chart as a real edge while the S3 API has no
# router (exposure.mode none). ci/e2e-check-distributed.sh proves the sticky cookie keeps a browser on one
# peer, and that the S3 host is unrouted. Plain HTTP (tls:false).
mode: distributed
console:
  enabled: true
  exposure:
    mode: traefik
  ingress:
    host: rustfs-cluster-console.e2e.test
    tls: false
