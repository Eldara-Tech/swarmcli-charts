name: rustfs
description: RustFS S3-compatible object store for Docker Swarm — single node, credentials from Swarm secrets, buckets created at start, optional web console, Traefik-routed or overlay-only
# version is a placeholder — the git tag (rustfs/vX.Y.Z) sets the real version at release.
version: 0.1.0
# appVersion is the default image tag for rustfs/rustfs.
# renovate: image=rustfs/rustfs
appVersion: "1.0.1"
# Oldest swarmcli whose chart engine renders this chart; verified by
# scripts/floor-check.sh against a real binary of that version.
swarmcliVersion: ">= 1.11.0"
maintainers:
  - name: Eldara
    url: https://github.com/Eldara-Tech
keywords:
  - rustfs
  - s3
  - object-storage
  - minio
  - stateful
home: https://github.com/rustfs/rustfs
sources:
  - https://github.com/rustfs/rustfs
  - https://github.com/Eldara-Tech/swarmcli-charts
# host-mount covers the opt-in persistence.volumePath bind mount only; the default render
# uses a named volume and needs no acknowledgment.
annotations:
  swarmcli-charts/allow: "host-mount"
