# The e2e fixture: every external dependency is a throwaway ci/e2e-setup.sh stands up —
# PostgreSQL, a SeaweedFS S3 endpoint on its own overlay and an OIDC discovery mock for
# oauth2-proxy.
database:
  host: airbyte-e2e-postgres
storage:
  endpoint: http://airbyte-e2e-s3:8333
  network: airbyte-e2e-s3-net
oauth2:
  issuerUrl: http://airbyte-e2e-oidc:8080/realms/airbyte
