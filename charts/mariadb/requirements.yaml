# External resources this chart needs. Authoritative: every external
# network/secret/config the rendered stack references must be listed here
# (swarmcli pre-flights it; scripts/requirements-check.sh enforces it at PR time).
networks:
  - name: mariadb-net
    driver: overlay
    attachable: true
    autoCreate: true
    description: "Shared overlay app stacks attach to in order to reach mariadb by service name"
  - name: "{{ .Values.metrics.network }}"
    driver: overlay
    attachable: true
    autoCreate: true
    description: "Overlay the exporter shares with Prometheus (when metrics.enabled); the prometheus-stack chart scrapes on it by default"
secrets:
  - name: mariadb_root_password
    description: "MariaDB root password. Pre-create: printf 'S3cr3t' | docker secret create mariadb_root_password -"
  - name: mariadb_password
    description: "MariaDB app-user password (when auth.appUser.enabled). Pre-create: printf 'S3cr3t' | docker secret create mariadb_password -"
  - name: "{{ .Values.metrics.secretName }}"
    description: "Password of the exporter's database user (when metrics.enabled). Pre-create: openssl rand -base64 32 | docker secret create mariadb_exporter_password -"
configs: []
