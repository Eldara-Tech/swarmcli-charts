name: superset
description: Apache Superset BI/visualization platform on Docker Swarm — external metadata DB, external or embedded Redis, Celery workers, Traefik-routed
# version is a placeholder — the git tag (superset/vX.Y.Z) sets the real version at release.
version: 0.2.0
# appVersion is the default image tag for apache/superset.
# renovate: image=apache/superset
appVersion: "6.1.0"
# Oldest swarmcli whose chart engine renders this chart; verified by
# scripts/floor-check.sh against a real binary of that version.
swarmcliVersion: ">= 1.11.0"
maintainers:
  - name: Eldara
    url: https://github.com/Eldara-Tech
keywords:
  - superset
  - bi
  - analytics
  - visualization
home: https://github.com/Eldara-Tech/swarmcli-charts
sources:
  - https://github.com/apache/superset
  - https://superset.apache.org/
# No swarmcli-charts/allow annotation: Superset is STATELESS here (all DURABLE state lives in
# the external metadata DB; the redis.mode: embedded Redis is deliberately EPHEMERAL — no
# volume, no node pin — so it does not change this), so the rendered stack mounts no host path,
# no docker.sock, and runs unprivileged as the image's non-root `superset` user.
