    alert_rule_test:
      - eval_time: 5m
        alertname: PatroniNoPrimary
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              stack: 'nopri'
            exp_annotations:
              summary: "Patroni cluster nopri has no primary"
              description: "For a minute no peer of nopri has held the leader key, so the proxy routes no write anywhere. A switchover takes about 10 seconds; this is longer. See `patronictl list` in any peer."
      - eval_time: 5m
        alertname: PatroniMultiplePrimaries
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              stack: 'split'
            exp_annotations:
              summary: "Patroni cluster split reports 2 primaries"
              description: "More than one peer of split has reported itself primary for a minute. The proxy routes writes to whichever answers its check, so writes may be diverging."
      - eval_time: 5m
        alertname: PatroniPeerDown
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.down_postgres-patroni-3:8008'
              name: 'postgres-patroni-3'
              scope: 'postgres-patroni'
              stack: 'down'
              job: 'down_postgres-patroni-metrics'
              instance: 'down_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Patroni on tasks.down_postgres-patroni-3:8008 in down does not answer"
              description: "The collector has not reached the Patroni REST API at tasks.down_postgres-patroni-3:8008 for 2 minutes: the peer is down, rescheduling, or not yet in DNS. The cluster serves without it, with one failover candidate fewer."
      - eval_time: 10m
        alertname: PatroniReplicaNotStreaming
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.lag_postgres-patroni-3:8008'
              name: 'postgres-patroni-3'
              scope: 'postgres-patroni'
              stack: 'lag'
              job: 'lag_postgres-patroni-metrics'
              instance: 'lag_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Replica postgres-patroni-3 in lag is not streaming"
              description: "Replica postgres-patroni-3 has not streamed from the primary for 5 minutes: it is copying it, replaying archived WAL, or cut off. It falls behind and stops being a failover candidate."
      - eval_time: 10m
        alertname: PatroniReplicaLagging
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.lag_postgres-patroni-2:8008'
              name: 'postgres-patroni-2'
              scope: 'postgres-patroni'
              stack: 'lag'
              job: 'lag_postgres-patroni-metrics'
              instance: 'lag_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Replica postgres-patroni-2 in lag is 2MiB behind the primary"
              description: "For 5 minutes replica postgres-patroni-2 has been more than maximum_lag_on_failover (1 MiB) behind, so a failover would not promote it."
      - eval_time: 5m
        alertname: PatroniFailsafeModeActive
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              stack: 'failsafe'
            exp_annotations:
              summary: "Patroni cluster failsafe is running on failsafe_mode, without etcd"
              description: "The peers cannot reach etcd, and the primary stays writable only through failsafe_mode, which ends the moment any peer stops answering: the primary then turns read-only. Bring etcd back (see EtcdNoLeader)."
      - eval_time: 5m
        alertname: PatroniDCSUnreachable
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.failsafe_postgres-patroni-1:8008'
              name: 'postgres-patroni-1'
              scope: 'postgres-patroni'
              stack: 'failsafe'
              job: 'failsafe_postgres-patroni-metrics'
              instance: 'failsafe_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Peer postgres-patroni-1 in failsafe has not reached etcd for 5m 0s"
              description: "Patroni on postgres-patroni-1 has not reached etcd for over a minute. A replica in that state cannot take part in a failover; a primary keeps writing only through failsafe_mode."
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.failsafe_postgres-patroni-2:8008'
              name: 'postgres-patroni-2'
              scope: 'postgres-patroni'
              stack: 'failsafe'
              job: 'failsafe_postgres-patroni-metrics'
              instance: 'failsafe_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Peer postgres-patroni-2 in failsafe has not reached etcd for 5m 0s"
              description: "Patroni on postgres-patroni-2 has not reached etcd for over a minute. A replica in that state cannot take part in a failover; a primary keeps writing only through failsafe_mode."
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.failsafe_postgres-patroni-3:8008'
              name: 'postgres-patroni-3'
              scope: 'postgres-patroni'
              stack: 'failsafe'
              job: 'failsafe_postgres-patroni-metrics'
              instance: 'failsafe_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Peer postgres-patroni-3 in failsafe has not reached etcd for 5m 0s"
              description: "Patroni on postgres-patroni-3 has not reached etcd for over a minute. A replica in that state cannot take part in a failover; a primary keeps writing only through failsafe_mode."
      - eval_time: 30m
        alertname: PatroniPaused
        exp_alerts: []
      - eval_time: 70m
        alertname: PatroniPaused
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.maint_postgres-patroni-1:8008'
              name: 'postgres-patroni-1'
              scope: 'postgres-patroni'
              stack: 'maint'
              job: 'maint_postgres-patroni-metrics'
              instance: 'maint_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Automatic failover is paused in maint"
              description: "Patroni has been in maintenance mode for an hour (`patronictl pause`): nothing fails over if the primary is lost. Resume it with `patronictl resume`."
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.maint_postgres-patroni-2:8008'
              name: 'postgres-patroni-2'
              scope: 'postgres-patroni'
              stack: 'maint'
              job: 'maint_postgres-patroni-metrics'
              instance: 'maint_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Automatic failover is paused in maint"
              description: "Patroni has been in maintenance mode for an hour (`patronictl pause`): nothing fails over if the primary is lost. Resume it with `patronictl resume`."
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.maint_postgres-patroni-3:8008'
              name: 'postgres-patroni-3'
              scope: 'postgres-patroni'
              stack: 'maint'
              job: 'maint_postgres-patroni-metrics'
              instance: 'maint_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Automatic failover is paused in maint"
              description: "Patroni has been in maintenance mode for an hour (`patronictl pause`): nothing fails over if the primary is lost. Resume it with `patronictl resume`."
      - eval_time: 40m
        alertname: PatroniPendingRestart
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              exported_job: 'patroni'
              exported_instance: 'tasks.maint_postgres-patroni-2:8008'
              name: 'postgres-patroni-2'
              scope: 'postgres-patroni'
              stack: 'maint'
              job: 'maint_postgres-patroni-metrics'
              instance: 'maint_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "Peer postgres-patroni-2 in maint waits for a restart to apply a setting"
              description: "A changed setting on postgres-patroni-2 takes effect only after a restart, and it has waited 30 minutes. README § Changing Patroni and PostgreSQL settings: `patronictl restart <cluster> --pending`."
      - eval_time: 5m
        alertname: EtcdNoLeader
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              exported_job: 'etcd'
              exported_instance: 'quorum-etcd-1:2381'
              stack: 'quorum'
              job: 'quorum_postgres-patroni-metrics'
              instance: 'quorum_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "etcd member quorum-etcd-1:2381 in quorum has no leader"
              description: "etcd has had no leader for a minute: its quorum is lost. Patroni cannot fail over, and the primary keeps writing only through failsafe_mode. README § Replacing an etcd member, or § etcd lost its majority for good."
      - eval_time: 5m
        alertname: EtcdMemberDown
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              exported_job: 'etcd'
              exported_instance: 'quorum-etcd-2:2381'
              stack: 'quorum'
              job: 'quorum_postgres-patroni-metrics'
              instance: 'quorum_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "etcd member quorum-etcd-2:2381 in quorum does not answer"
              description: "The collector has not reached etcd member quorum-etcd-2:2381 for 2 minutes. With a majority still up nothing is lost yet, but one more member down loses the quorum."
          - exp_labels:
              severity: 'warning'
              exported_job: 'etcd'
              exported_instance: 'quorum-etcd-3:2381'
              stack: 'quorum'
              job: 'quorum_postgres-patroni-metrics'
              instance: 'quorum_postgres-patroni-metrics:8889'
            exp_annotations:
              summary: "etcd member quorum-etcd-3:2381 in quorum does not answer"
              description: "The collector has not reached etcd member quorum-etcd-3:2381 for 2 minutes. With a majority still up nothing is lost yet, but one more member down loses the quorum."
      - eval_time: 30m
        alertname: EtcdHighNumberOfLeaderChanges
        exp_alerts:
          - exp_labels:
              severity: 'warning'
              exported_job: 'etcd'
              exported_instance: 'churn-etcd-1:2381'
              stack: 'churn'
              job: 'churn_postgres-patroni-metrics'
              instance: 'churn_postgres-patroni-metrics:8889'
            exp_annotations:
