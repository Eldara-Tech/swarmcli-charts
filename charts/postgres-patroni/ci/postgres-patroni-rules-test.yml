# promtool unit tests for monitoring/postgres-patroni-rules.yml, which the chart ships for
# operators to load into their Prometheus but does not deploy itself. ci/e2e-check.sh runs
# them with a pinned prom/prometheus image's promtool in the metrics case.
#
# Generated label sets follow what Prometheus stores from this chart: the collector's series
# carry exported_job (patroni or etcd) and exported_instance beside the collector's own job,
# instance and stack; the exporters' carry job <release>_postgres-patroni-exporter-<N>.
# Release `ok` is healthy throughout, and every test below names each alert it expects, so
# it also proves `ok` raises nothing. Each other release breaks one or two things, as its
# comment in the input says.
rule_files:
  - ../monitoring/postgres-patroni-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'patroni_primary{exported_job="patroni",exported_instance="tasks.ok_postgres-patroni-1:8008",name="postgres-patroni-1",scope="postgres-patroni",stack="ok",job="ok_postgres-patroni-metrics",instance="ok_postgres-patroni-metrics:8889"}'
        values: '1x80'
      - series: 'patroni_replica{exported_job="patroni",exported_instance="tasks.ok_postgres-patroni-1:8008",name="postgres-patroni-1",scope="postgres-patroni",stack="ok",job="ok_postgres-patroni-metrics",instance="ok_postgres-patroni-metrics:8889"}'
        values: '0x80'
      - series: 'patroni_postgres_streaming{exported_job="patroni",exported_instance="tasks.ok_postgres-patroni-1:8008",name="postgres-patroni-1",scope="postgres-patroni",stack="ok",job="ok_postgres-patroni-metrics",instance="ok_postgres-patroni-metrics:8889"}'
        values: '0x80'
      - series: 'patroni_xlog_location{exported_job="patroni",exported_instance="tasks.ok_postgres-patroni-1:8008",name="postgres-patroni-1",scope="postgres-patroni",stack="ok",job="ok_postgres-patroni-metrics",instance="ok_postgres-patroni-metrics:8889"}'
