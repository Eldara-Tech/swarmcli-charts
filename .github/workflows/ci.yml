name: CI

# Lints the release machinery itself — the GitHub Actions workflows, the Renovate
# config, and the shell scripts that package charts and build the index. A broken
# workflow, script, or matchString silently fails releases or silently stops
# maintaining the image pins, so this guards the parts chart-structure linting
# (charts.yml) doesn't cover. The index generator is not just shellchecked but
# RUN against a throwaway repo + a mocked gh (scripts/generate-index-test.sh),
# because its jq/yq assembly is where a silently-broken index would come from.
#
# The workflow triggers on every PR (no path filter) but a change-detection job
# skips the `lint` job when nothing under .github/ or scripts/ changed. A skipped
# required check counts as passing, so `lint` can be a required check enforced
# only when relevant files change, without leaving unrelated PRs pending.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || git diff --name-only HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(\.github/|scripts/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No workflow/script changes; skipping machinery lint."
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # actionlint validates workflow syntax and ${{ }} expressions. Its embedded
      # shellcheck pass is disabled here (-shellcheck=) so run-block style nits
      # don't fail the job; shell scripts are checked separately below.
      - name: Lint workflows (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck=

      # shellcheck is preinstalled on ubuntu runners. --severity=error fails only
      # on genuine bugs, not style warnings, so it won't block on existing scripts.
      - name: Lint shell scripts (shellcheck)
        run: shellcheck --severity=error scripts/*.sh scripts/e2e-edge/*.sh

      # generate-index.sh assembles the PUBLISHED index.yaml. A jq/yq regression there
      # ships a subtly wrong index (a version reparsed as a float, a description that
      # breaks the doc, a URL that no longer resolves) that only breaks downstream — and
      # now fails install, since swarmcli verifies the chart digest against this index
      # (Eldara-Tech/swarmcli#447). generate-index-test.sh runs it against a throwaway
      # repo + a mocked gh and asserts the output. jq is preinstalled; it also needs
      # mikefarah yq (installed explicitly, as charts.yml does, so coverage is reproducible).
      - name: Install yq (mikefarah v4)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/yq" https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test the index generator (scripts/generate-index-test.sh)
        run: scripts/generate-index-test.sh

      # A malformed matchString does not error at run time — Renovate just extracts
      # zero dependencies and opens no PRs, so the pins silently stop being
      # maintained. The validator is the only thing that turns that into a failure.
      # default.json is the shareable preset downstream users extend, so breaking
      # it breaks *their* updates, not ours: validate it too.
      - name: Validate Renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict .github/renovate.json default.json
