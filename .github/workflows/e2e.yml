name: E2E

# Deploys every covered chart to a REAL (throwaway, single-node) Docker Swarm and asserts
# it runs — the loop scripts/e2e-test.sh drives locally via `make e2e`, now also in CI.
# Unlike the data-only Charts workflow (which only renders), this proves each stack
# converges, serves, and — for the openclaw backend fixture — that the gateway actually
# reaches its configured model backend (the regression guard for #60).
#
# It stays fork-safe like the other workflows: it uses only public images and dummy secrets
# created on the runner by each chart's ci/e2e-setup.sh (E2E_SWARM_INIT=1 stands up the
# throwaway swarm), never a repo secret, with a read-only token.
#
# A separate `repo-apply` job additionally drives the real repository-consumer path
# (scripts/repo-apply-test.sh): install whoami FROM a served index — resolve, download,
# digest-verify (swarmcli#447), render, apply — then assert outdated/upgrade/idempotence.
# e2e-test.sh installs a local chart *directory*, so nothing else here exercises that path.
#
# One job PER CHART (strategy.matrix below), so charts run in parallel and in isolation.
# CI runs a curated fixture SUBSET per chart via E2E_CASES (the cheap "does it deploy and
# come up" smoke); the full `make e2e` still runs every fixture locally. Add a chart to CI
# with one matrix line {chart, cases, timeout} — plus ci/e2e-setup.sh/-teardown.sh only if
# it needs external resources (charts that converge solo, e.g. whoami/swarm-cronjob, need none).
#
# Triggers on every PR but a change-detection job skips the heavy run when no chart/script
# files changed; a skipped required check counts as passing, so this can be a required check
# without hanging unrelated PRs.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Pushes always run; PRs run only when a chart source or the e2e machinery
          # changed, so the required check is enforced iff relevant files changed (and
          # reports skipped = pass otherwise).
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || git diff --name-only HEAD)
          if printf '%s\n' "$changed" | grep -E '^(charts/|scripts/|Makefile|\.github/e2e-matrix\.yaml|\.github/workflows/e2e\.yml)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No chart/script changes; skipping e2e."
          fi

  # The per-chart fixture matrix lives in .github/e2e-matrix.yaml (with its
  # curation rationale) and is SHARED with nightly.yml, so the two never drift.
  # This job turns that YAML into the JSON the matrix strategy consumes.
  prepare:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: load
        name: Load e2e matrix from .github/e2e-matrix.yaml
        run: |
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /tmp/yq
          echo "matrix=$(/tmp/yq -o=json -I=0 '.' .github/e2e-matrix.yaml)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [changes, prepare]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Hard backstop so a stuck phase self-kills: matrix.timeout only bounds convergence
    # (E2E_TIMEOUT), not the image pull, the smoke poll or teardown. Sized above the heaviest
    # chart's converge (gitlab, 30m) plus its multi-gigabyte pull, smoke budget and teardown,
    # well under GitHub's 360m default.
    timeout-minutes: 75
    name: e2e (${{ matrix.chart }})
    strategy:
      fail-fast: false          # one chart's failure must not cancel its siblings
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false

      # swarmcli is the chart client. PR CI builds `main` to catch a renderer
      # breakage the moment it lands; nightly.yml runs this same e2e suite against
      # the latest release. Same build as the Charts workflow.
      - name: Build swarmcli
        run: scripts/install-swarmcli.sh "$PWD/.swarmcli-bin"

      # Deploy this chart's curated fixtures to a throwaway single-node swarm, converge,
      # smoke-test, and tear down. E2E_SWARM_INIT=1 initialises the swarm; the chart's
      # ci/e2e-setup.sh provisions its dummy secrets / node labels / co-located backend.
      # E2E_CASES selects the curated subset (empty => every fixture).
      - name: Deploy + verify (${{ matrix.chart }})
        run: |
          SWARMCLI="$PWD/.swarmcli-bin/swarmcli" \
          E2E_SWARM_INIT=1 \
          E2E_CASES="${{ matrix.cases }}" \
          E2E_TIMEOUT="${{ matrix.timeout }}" \
          scripts/e2e-test.sh "${{ matrix.chart }}"

  # The deploy half of the repo-consumer path: install whoami FROM a served index
  # (resolve -> download -> digest-verify -> render -> apply), then assert the
  # GitOps contract on a real swarm — `outdated` flags the older install, a bump
  # is an `upgrade`, and re-applying is `unchanged`. This is the one flow neither
  # e2e-test.sh (installs a local directory) nor local-repo-test.sh (stops at
  # search) drives. One whoami job, not the per-chart matrix: whoami converges solo
  # and the flow is about the repo/index/apply machinery, not each chart.
  repo-apply:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false

      - name: Build swarmcli
        run: scripts/install-swarmcli.sh "$PWD/.swarmcli-bin"

      # E2E_SWARM_INIT=1 stands up the throwaway swarm; the script runs the swarm-free
      # template + digest checks AND the apply/outdated/upgrade/idempotence loop.
      - name: Repo-apply flow (install + outdated + upgrade + idempotence)
        run: |
          SWARMCLI="$PWD/.swarmcli-bin/swarmcli" \
          E2E_SWARM_INIT=1 \
          scripts/repo-apply-test.sh
