name: mongodb
description: MongoDB document database for Docker Swarm — persistent, secret-authenticated, single-node pinned, optional single-member replica set
version: 0.1.0
# renovate: image=mongo
appVersion: "8.3"
# Oldest swarmcli whose chart engine renders this chart; verified by
# scripts/floor-check.sh against a real binary of that version.
swarmcliVersion: ">= 1.11.0"
# host-mount is acknowledged because persistence.volumePath can bind-mount the data dir from an
# operator-chosen host path. The default (named volume) render mounts no host path — no
# docker.sock, unprivileged — so the annotation is exercised by the security scan only when a
# host path is configured.
annotations:
  swarmcli-charts/allow: "host-mount"
maintainers:
  - name: Eldara
    url: https://github.com/Eldara-Tech
keywords:
  - mongodb
  - mongo
  - database
  - nosql
  - document
  - stateful
  - swarm
home: https://github.com/Eldara-Tech/swarmcli-charts
sources:
  - https://github.com/Eldara-Tech/swarmcli-charts
  - https://github.com/mongodb/mongo
