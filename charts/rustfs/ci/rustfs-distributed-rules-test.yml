# promtool unit tests for the rustfs-distributed group of monitoring/rustfs-rules.yml, which
# the chart ships for operators to load into their Prometheus but does not deploy itself.
# ci/e2e-check-distributed.sh runs them with a pinned prom/prometheus image's promtool in the
# metrics case; ci/rustfs-rules-test.yml covers the standalone group. Generated once by a
# script and edited by hand since; the series are what four 1-drive peers push, with the
# labels the collector and prometheus-stack's discovery give them.
#
# One release per failure. Three must raise nothing: `ok` is a healthy cluster under load;
# `start` is a cluster forming, whose peers first report 2, then 3, then 4 drives online and
# one write-health 0 before the set is writable. `single` is a standalone release, whose one
# drive sits at its own write quorum and is offline, under the standalone job: the
# distributed group selects none of its series, and only the standalone group's alerts fire
# for it (its drive offline, critical, and not reporting, since it pushes no uptime here).
#
# A peer that stops (`onedown`, `twodown`, `threedown` stop peers at 5m) keeps its last
# healthy values in the collector for 5 minutes: the rules must read the worst view.
rule_files:
  - ../monitoring/rustfs-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # Every release's collector answers throughout.
      - series: 'up{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok"}'
        values: '1x34'
      - series: 'up{job="start_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="start"}'
        values: '1x34'
      - series: 'up{job="onedown_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="onedown"}'
        values: '1x34'
      - series: 'up{job="twodown_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="twodown"}'
        values: '1x34'
      - series: 'up{job="threedown_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="threedown"}'
        values: '1x34'
      - series: 'up{job="silent_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="silent"}'
        values: '1x34'
      - series: 'up{job="errors_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="errors"}'
        values: '1x34'
      - series: 'up{job="full_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="full"}'
        values: '1x34'
      - series: 'up{job="ioerr_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ioerr"}'
        values: '1x34'
      - series: 'up{job="single_rustfs-metrics",instance="10.0.9.5:8889",stack="single"}'
        values: '1x34'

      # ok: healthy under load, 1% of it 5xx.
      - series: 'rustfs_cluster_erasure_set_online_drives_count{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.3",collection_scope="cluster",observer="ok-rustfs-1:9000",pool_id="0",set_id="0"}'
        values: '4x34'
      - series: 'rustfs_cluster_erasure_set_write_quorum{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.3",collection_scope="cluster",observer="ok-rustfs-1:9000",pool_id="0",set_id="0"}'
        values: '3x34'
      - series: 'rustfs_cluster_erasure_set_write_health{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.3",collection_scope="cluster",observer="ok-rustfs-1:9000",pool_id="0",set_id="0"}'
        values: '1x34'
      - series: 'rustfs_cluster_erasure_set_read_health{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.3",collection_scope="cluster",observer="ok-rustfs-1:9000",pool_id="0",set_id="0"}'
        values: '1x34'
      - series: 'rustfs_cluster_health_drives_offline_count{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.3",collection_scope="cluster",observer="ok-rustfs-1:9000"}'
        values: '0x34'
      - series: 'rustfs_system_process_uptime_seconds{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.3",server="ok-rustfs-1:9000"}'
        values: '600+60x34'
      - series: 'rustfs_cluster_erasure_set_online_drives_count{job="ok_rustfs-distributed-metrics",instance="10.0.9.5:8889",stack="ok",exported_job="RustFS",exported_instance="172.18.0.4",collection_scope="cluster",observer="ok-rustfs-2:9000",pool_id="0",set_id="0"}'
