# External resources this chart needs. Authoritative: every external network the rendered
# stack references must be listed here (swarmcli pre-flights it; CI enforces it via
# scripts/requirements-check.sh). swarmcli renders this file with the release's values, so
# the templated name below tracks any exposure.network override.
#
# Plain YAML with value substitution only (no Go-template control flow like if/range —
# those non-scalar actions would break yamllint). The ingress overlay is declared
# unconditionally: the default `published` mode references no external network (so the entry
# is simply never used), while the traefik / none modes attach the service to it — the
# used-is-subset-of-declared contract holds either way.
networks:
  - name: "{{ .Values.exposure.network }}"
    driver: overlay
    attachable: true
    autoCreate: false
    description: "Shared ingress overlay the reverse proxy publishes routes on (traefik & none modes); provisioned by the traefik chart/operator (never created here)"
secrets: []
configs: []
