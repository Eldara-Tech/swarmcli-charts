name: Pages Index

# Publish the regenerated index to the live GitHub Pages site. Pages on this
# repo is configured with build_type=workflow, so it serves the artifact
# uploaded here — NOT the gh-pages branch. A prior revision pushed to the
# gh-pages branch instead, which is inert under this Pages config and silently
# froze the served index. We deploy the uploaded artifact through the Pages REST
# deployment API below — the same workflow-build mechanism actions/deploy-pages
# wraps, but with a per-run build version so same-commit releases don't dedupe.
#
# This lives in its own workflow, rather than as a job in `Release Chart`, for
# one reason: the `github-pages` environment carries a deployment branch policy
# admitting `main` only, and `Release Chart` runs on a TAG ref. A deployment
# refused by that policy comes back from the API as a bare 404, so the job died
# on `gh: Not Found (HTTP 404)` with nothing naming the environment — the index
# froze on 2026-07-20 and every chart released after it published its .tgz but
# never reached index.yaml. A `workflow_run` workflow always executes against
# the default branch ref, which is what the policy wants.
on:
  workflow_run:
    workflows: ["Release Chart"]
    types: [completed]
  # Rebuilding the index needs no release to hang off — it is generated from the
  # published releases. Without this there is no way to repair a stale index
  # except by releasing another chart, which is how #114's freeze had to sit
  # until something happened to be released.
  workflow_dispatch:

jobs:
  update-index:
    # A release that did not publish has nothing to add to the index. A manual
    # run has no triggering workflow, so it carries no conclusion to check.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Serialise index deploys so overlapping runs don't churn the Pages API. Losing
    # a race no longer matters: each deploy carries a per-run pages_build_version
    # (see the deploy step), so charts released at the SAME commit can't collide on
    # one deployment id and drop the fuller index — that was #89, fixed there.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write        # create the Pages deployment
      id-token: write     # mint the OIDC token the deployment API requires
      actions: read       # look up the uploaded artifact's id via the REST API
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The index is generated from the published releases plus `git show
          # <tag>:path` for each chart's metadata, so this needs every tag. Naming
          # the branch keeps it independent of whatever ref triggered the release.
          ref: main
          fetch-depth: 0

      - name: Generate index.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/generate-index.sh
          mkdir -p public
          ./scripts/generate-index.sh "${{ github.repository }}" > public/index.yaml
          echo "=== Generated index.yaml ==="
          cat public/index.yaml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

      # actions/deploy-pages hardcodes pages_build_version to GITHUB_SHA, and Pages
      # keeps only the FIRST deployment for a given build version — so every chart
      # released at one commit deploys the same SHA and only the earliest (partial)
      # index survives (#89). Deploy through the Pages REST API directly with a
      # per-RUN build version instead, so no two index deploys ever dedupe and the
      # last run (which sees every release) always wins.
      - name: Deploy index to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # The artifact upload-pages-artifact just created (named "github-pages"),
          # scoped to this run.
          ARTIFACT_ID=$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            -q '.artifacts[] | select(.name == "github-pages") | .id' | head -n1)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: no github-pages artifact found for run ${GITHUB_RUN_ID}" >&2
            exit 1
          fi

          # The deployment API requires an OIDC token, minted with the default
          # audience exactly as deploy-pages does via core.getIDToken().
          OIDC_TOKEN=$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: could not mint an OIDC token (need id-token: write)" >&2
            exit 1
          fi

          # Per-run and thus unique even across charts sharing one commit.
          BUILD_VERSION="${GITHUB_SHA}-${GITHUB_RUN_ID}"

          STATUS_URL=$(gh api -X POST "repos/${REPO}/pages/deployments" \
            -F "artifact_id=${ARTIFACT_ID}" \
            -f "pages_build_version=${BUILD_VERSION}" \
            -f "oidc_token=${OIDC_TOKEN}" \
            -q '.status_url')
          echo "Created Pages deployment ${BUILD_VERSION} (artifact ${ARTIFACT_ID})"

          # Wait for it to go live so a server-side failure fails the job.
          for _ in $(seq 1 60); do
            STATUS=$(gh api "${STATUS_URL}" -q '.status' 2>/dev/null || true)
            echo "deployment status: ${STATUS:-<pending>}"
            case "${STATUS}" in
              succeed)
                echo "Index deployed."
                exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_attempt_error|deployment_lost)
                echo "ERROR: Pages deployment ended in status '${STATUS}'" >&2
                exit 1 ;;
            esac
            sleep 5
          done
          echo "ERROR: timed out after 5m waiting for the Pages deployment" >&2
          exit 1
