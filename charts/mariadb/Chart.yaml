name: mariadb
description: MariaDB relational database for Docker Swarm — persistent, secret-authenticated, single-node pinned
version: 0.1.0
appVersion: "11.8"
# No swarmcli-charts/allow annotation: no docker.sock, no host bind mount (data is
# a NAMED volume), unprivileged. security-scan.sh finds nothing to acknowledge.
maintainers:
  - name: Eldara
    url: https://github.com/Eldara-Tech
keywords:
  - mariadb
  - mysql
  - database
  - sql
  - relational
  - stateful
  - swarm
home: https://github.com/Eldara-Tech/swarmcli-charts
sources:
  - https://github.com/Eldara-Tech/swarmcli-charts
  - https://github.com/MariaDB/server
