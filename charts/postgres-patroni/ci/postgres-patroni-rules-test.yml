        values: '0x80'
      - series: 'patroni_failsafe_mode_is_active{exported_job="patroni",exported_instance="tasks.ok_postgres-patroni-1:8008",name="postgres-patroni-1",scope="postgres-patroni",stack="ok",job="ok_postgres-patroni-metrics",instance="ok_postgres-patroni-metrics:8889"}'
        values: '0x80'
      - series: 'patroni_dcs_last_seen{exported_job="patroni",exported_instance="tasks.ok_postgres-patroni-1:8008",name="postgres-patroni-1",scope="postgres-patroni",stack="ok",job="ok_postgres-patroni-metrics",instance="ok_postgres-patroni-metrics:8889"}'
