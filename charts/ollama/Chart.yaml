name: ollama
description: Ollama self-hosted LLM server for Docker Swarm — offline models, stateful, single-node pinned, optional GPU
# version is a placeholder — the git tag (ollama/vX.Y.Z) sets the real version at release.
version: 0.2.0
# appVersion is the default image tag for ollama/ollama.
# renovate: image=ollama/ollama
appVersion: "0.32.5"
# Oldest swarmcli whose chart engine renders this chart; verified by
# scripts/floor-check.sh against a real binary of that version.
swarmcliVersion: ">= 1.11.0"
maintainers:
  - name: Eldara
    url: https://github.com/Eldara-Tech
keywords:
  - ollama
  - llm
  - ai
  - inference
home: https://github.com/Eldara-Tech/swarmcli-charts
sources:
  - https://github.com/ollama/ollama
  - https://ollama.com
# The default render needs no acknowledgment: model data lives on a node-local named
# volume (no host mount), there is no auth secret, and no docker.sock / privileged /
# host-network / cap_add. Only the opt-in host-path persistence (persistence.volumePath)
# introduces a host bind mount, which the security scan flags as host-mount only when
# configured — acknowledged here:
annotations:
  swarmcli-charts/allow: "host-mount"
