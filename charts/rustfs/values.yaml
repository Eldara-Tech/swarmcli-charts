# rustfs chart default values.
#
# RustFS as an S3-compatible object store: ONE service, one node, one drive (/data on a
# node-local volume). That is the shape for a build cache, a backup target or an
# application's blob store on a small swarm. A single drive has no erasure-coding
# redundancy, and this chart does not run RustFS's distributed mode.
#
# Two things drive the defaults:
#
#   1. Credentials come from two external Swarm secrets, read by RustFS itself through
#      RUSTFS_ACCESS_KEY_FILE / RUSTFS_SECRET_KEY_FILE. The container refuses to start
#      when either is missing, empty, or RustFS's public default `rustfsadmin`.
#   2. Only the S3 API listens by default. The web console is a second listener that
#      serves the S3 and admin API as well, so it is opt-in (console.enabled).

image:
  repository: rustfs/rustfs
  tag: ""  # defaults to appVersion from Chart.yaml

s3:
  # Port the S3 API listens on inside the container — the port other stacks dial on
  # network.name, the Traefik load-balancer target and the published target.
  port: 9000
  # EXTERNAL Swarm secrets holding the root access key and secret key. Pre-create them;
  # the chart never creates secrets:
  #   printf '%s' 'cache-access-key' | docker secret create rustfs-access-key -
  #   openssl rand -base64 30 | tr -d '\n' | docker secret create rustfs-secret-key -
  accessKeySecret: rustfs-access-key
  secretKeySecret: rustfs-secret-key

# The RustFS web console: a second listener serving the console UI under
# /rustfs/console/, plus the same S3 and admin API as s3.port. You log in with the
# key pair above. Off by default. When on, it is reachable on network.name at
# console.port, and in traefik mode on console.host, in published mode on
# publish.consolePort.
console:
  enabled: false
  port: 9001
  # Host() for the console's own router (traefik mode, required when enabled there).
  host: ""

# Buckets created once the server is up, if they do not exist yet (an existing bucket
# is left alone, so restarts are safe). Clients such as the GitLab Runner cache never
# create their own bucket. S3 naming rules apply: 3-63 characters of a-z, 0-9, '.'
# and '-', starting and ending with a letter or digit.
buckets: []

# Persistence. Named volume at /data. enabled:false => ephemeral: every object is lost
# when the task is replaced, which is useful for a smoke test and nothing else.
persistence:
  enabled: true
  volumeName: rustfs-data
  # Store the data under a host directory instead of Docker's managed volume storage.
  # When set it TAKES PRECEDENCE over volumeName: /data is bind-mounted from this
  # absolute host path on the pinned node. It must already exist there and be owned by
  # uid/gid 10001 (RustFS runs as that user and cannot fix ownership itself):
  #   install -d -o 10001 -g 10001 -m 0750 <path>
  # This is host-filesystem access, acknowledged via swarmcli-charts/allow:
  # "host-mount" in Chart.yaml; the default named-volume render needs no acknowledgment.
  volumePath: ""
  # Node label pinning the service to the node carrying the data (Swarm volumes are
  # node-local). Rendered as `node.labels.<nodeLabel> == true` while persistence is
  # enabled, and dropped with it. Label exactly ONE node first:
  #   docker node update --label-add rustfs-data=true <node>
  # Set "" to schedule unpinned even with persistence on (single-node swarm).
  nodeLabel: rustfs-data

# Extra scheduling constraints, always applied (independent of the persistence pin
# above), e.g. ["node.hostname == node-29"].
placement:
  constraints: []

# The overlay S3 clients reach the store on, in every exposure mode. Other stacks join
# it as an external network and dial http://<release>_rustfs:<s3.port>.
# requirements.yaml declares it autoCreate:true, so it is created on first install.
network:
  name: rustfs-net

# How the S3 API (and the console, when enabled) is exposed beyond network.name:
#   none      - (default) nowhere else; only services on network.name reach it.
#   traefik   - Traefik deploy labels on exposure.network, routing ingress.host to the
#               S3 port (and console.host to the console). Path-style addressing
#               (https://<host>/<bucket>/<key>), which is what non-AWS S3 clients use.
#   published - publish s3.port on the Swarm as publish.port (and the console as
#               publish.consolePort).
exposure:
  mode: none
  # The edge proxy's overlay (traefik mode only). Provisioned by the proxy
  # chart/operator (requirements.yaml, autoCreate:false).
  network: traefik-public

# Public-facing address for traefik mode. host drives the Traefik Host() rule; tls
# selects whether an HTTPS router terminates TLS (and HTTP redirects to it).
ingress:
  host: s3.example.com
  tls: true

# traefik-mode routing. The defaults match the traefik chart in this repository;
# adjust them to your own Traefik if you run one.
traefik:
  certResolver: le
  entrypoints:
    http: http
    https: https
  # Base name for this chart's router/service objects (`<name>-http` / `<name>-https`
  # routers + the `<name>` service, and `<name>-console*` for the console). Empty =>
  # the release name.
  routerName: ""
  # Swarm-provider constraint label. The traefik chart runs with
  # --providers.swarm.exposedByDefault=false and a constraint on this label, so a
  # routed service must carry it to be discovered. Match your Traefik's.
  constraintLabel: traefik-public
  # Middleware on the HTTP router redirecting to HTTPS (only when ingress.tls). The
  # traefik chart always defines https-redirect in the swarm provider.
  redirectMiddleware: https-redirect
  # Seconds RustFS keeps an idle upstream HTTP/1.1 connection open (traefik mode
  # only; RustFS's own default is 75). It must outlast Traefik's upstream idle
  # timeout (90s by default), or Traefik reuses a connection RustFS has already
  # closed and a large PUT fails with "socket hang up".
  idleTimeoutSeconds: 120

# published-mode port publish. mode: ingress (routing mesh, every node) or host (only
# the node running the task).
publish:
  port: 9000
  consolePort: 9001
  mode: ingress

# Open-file limit for the RustFS process. Below 16384 RustFS disables its per-disk
# file-descriptor cache, which costs performance. 0 leaves the daemon's default.
nofile: 65536

# Extra environment variables, e.g. RUSTFS_SERVER_DOMAINS for virtual-hosted-style
# addressing, RUSTFS_REGION, or RUSTFS_OBS_ENDPOINT to push OpenTelemetry metrics and
# traces to a collector. Never put credentials here: they belong in the secrets above.
extraEnv: {}

# Probes /health/ready on the S3 port with the image's curl: 503 until storage and IAM
# are up, 200 after.
healthcheck:
  enabled: true
  interval: 15s
  timeout: 5s
  retries: 4
  startPeriod: 30s
  # Swarm's rollout monitor window. Must outlast the worst-case first failure
  # (startPeriod + retries x interval = 1m30s here), or a broken deploy reports success.
  monitor: 2m

# Time Swarm waits after SIGTERM before SIGKILL.
stopGracePeriod: 30s

# Swarm deploy resources (optional; each rendered only when set).
resources:
  limits:
    memory: ""
  reservations:
    memory: ""

# Extra deploy labels (key: value), merged after the Traefik labels.
labels: {}
