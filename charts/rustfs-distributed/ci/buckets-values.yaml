# Buckets created at start by peer 1, an extra placement constraint, a dotted name to prove
# the validator admits every legal character. ci/e2e-check.sh asserts both buckets exist on
# every peer, and that a forced restart of peer 1 keeps the data and does not trip over the
# buckets already being there.
buckets:
  - runner-cache
  - e2e.second-bucket
placement:
  constraints:
    - node.role == manager
