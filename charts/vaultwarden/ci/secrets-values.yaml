# Admin token + SMTP, both password-from-secret: the only fixture that renders the
# ADMIN_TOKEN/SMTP_PASSWORD export wrappers, the SMTP_* environment block and a
# multi-entry secrets: list. SQLite, so it exercises those independently of a
# database backend.
auth:
  adminToken:
    enabled: true
smtp:
  enabled: true
  username: vaultwarden@example.com
  password:
    enabled: true
