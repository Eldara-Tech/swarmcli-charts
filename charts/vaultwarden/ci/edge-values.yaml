# edge: prove a real HTTP request reaches Vaultwarden THROUGH a live Traefik edge,
# exercising the traefik-mode label/discovery contract at runtime — not just as
# rendered strings. ci/e2e-setup.sh stands up the in-repo traefik chart via
# scripts/e2e-edge/traefik-edge.sh; ci/e2e-check.sh curls the edge with a matching
# Host header and asserts a 200 from /alive (plus a 404 for an unknown host).
#
# tls:false so the http-entrypoint router forwards straight to the app instead of
# emitting the https-redirect middleware (there is no ACME/HTTPS router in CI).
# Ephemeral to keep it light — a routing check needs no volume and no node pin.
exposure:
  mode: traefik
ingress:
  host: vaultwarden.e2e.test
  tls: false
persistence:
  enabled: false
