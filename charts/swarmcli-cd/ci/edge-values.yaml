# Edge-routing fixture (issue #63): prove a real HTTP request reaches the controller's API
# THROUGH a live Traefik edge, exercising the traefik-mode label/discovery contract at
# runtime — not just as rendered strings. ci/e2e-setup.sh stands up the in-repo traefik
# chart via scripts/e2e-edge/traefik-edge.sh; ci/e2e-check.sh curls the edge with a
# matching Host header and asserts /healthz answers, which is the one endpoint that needs
# no token.
#
# tls:false so the http-entrypoint router forwards straight to the controller's 8080
# listener (there is no https-redirect / ACME router in CI).
exposure:
  mode: traefik
ingress:
  host: swarmcli-cd.e2e.test
  tls: false
