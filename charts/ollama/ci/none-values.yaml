# none: no port, no traefik labels — the service sits on the ingress overlay so a reverse
# proxy or other stacks reach it as ollama:11434. Exercises the external-network block with
# no ports: and no traefik labels (the labels: key is omitted when there are none). Also
# sets offline:false to cover the branch where OLLAMA_NO_CLOUD is NOT rendered.
exposure:
  mode: none
offline: false
