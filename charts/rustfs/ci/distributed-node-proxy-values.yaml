# distributed-traefik-values.yaml plus nodeProxy, the shape #342 asks for: the S3 API and
# the console stay on Traefik across the peers while every node also publishes the S3 API in
# host mode on 9002, failing over between the peers. Render-only (e2e-render-only): the live
# proxy is exercised by distributed-lifecycle.
mode: distributed
exposure:
  mode: traefik
ingress:
  host: s3-cluster.example.com
  tls: true
console:
  enabled: true
  exposure:
    mode: traefik
  ingress:
    host: rustfs-console.example.com
    tls: true
buckets:
  - runner-cache
nodeProxy:
  enabled: true
