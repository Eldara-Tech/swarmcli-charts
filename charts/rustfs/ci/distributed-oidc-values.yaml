# Console single sign-on against a stub OpenID provider on rustfs-net: ci/e2e-setup.sh starts
# it with a 404 for its discovery document, which RustFS never retries, and
# ci/e2e-check-distributed.sh serves the document later, so console.oidc.selfHeal (on by
# default) must restart every peer, one at a time. The console is traefik-routed with TLS,
# so the callback base is derived as https://<console.ingress.host>; labels only, nothing
# routes through an edge.
mode: distributed
console:
  enabled: true
  exposure:
    mode: traefik
  ingress:
    host: rustfs-cluster-console.e2e.test
    tls: true
  oidc:
    enabled: true
    configUrl: http://rustfs-e2e-idp:8080/realms/e2e/.well-known/openid-configuration
    # The stub is on rustfs-net, a private overlay address.
    allowPrivateIdp: true
    clientId: rustfs-e2e
