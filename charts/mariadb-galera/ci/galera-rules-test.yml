# promtool unit tests for monitoring/galera-rules.yml, which the chart ships for operators
# to load into their Prometheus but does not deploy itself. ci/e2e-check.sh runs them
# with a pinned prom/prometheus image's promtool in the metrics case.
#
# Cluster `db` loses a peer two minutes in; its peers are in every state an alert has to
# tell apart. Cluster `ok` stays whole and healthy, and must raise nothing.
rule_files:
  - ../monitoring/galera-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # Peer 1 loses its server at 2m; peer 2 never does.
      - series: 'mysql_up{job="db_mariadb-galera-exporter-1",instance="10.0.1.5:9104",stack="db"}'
        values: '1 1 0x10'
      - series: 'mysql_up{job="db_mariadb-galera-exporter-2",instance="10.0.1.6:9104",stack="db"}'
        values: '1x12'
      # Peer 1 is outside the primary component and Joining. Peer 2 donates a state
      # transfer and falls behind. Peer 3 is Synced but has a long receive queue, which
      # is no donor's problem. Peer 4 is Joined (3) but desynced on purpose.
      - series: 'mysql_global_status_wsrep_ready{job="db_mariadb-galera-exporter-1",instance="10.0.1.5:9104",stack="db"}'
        values: '0x12'
      - series: 'mysql_global_status_wsrep_ready{job="db_mariadb-galera-exporter-2",instance="10.0.1.6:9104",stack="db"}'
        values: '1x12'
      - series: 'mysql_global_status_wsrep_local_state{job="db_mariadb-galera-exporter-1",instance="10.0.1.5:9104",stack="db"}'
        values: '1x12'
      - series: 'mysql_global_status_wsrep_local_state{job="db_mariadb-galera-exporter-2",instance="10.0.1.6:9104",stack="db"}'
        values: '2x12'
      - series: 'mysql_global_status_wsrep_local_state{job="db_mariadb-galera-exporter-3",instance="10.0.1.7:9104",stack="db"}'
        values: '4x12'
      - series: 'mysql_global_status_wsrep_local_state{job="db_mariadb-galera-exporter-4",instance="10.0.1.8:9104",stack="db"}'
        values: '3x12'
      - series: 'mysql_global_variables_wsrep_desync{job="db_mariadb-galera-exporter-1",instance="10.0.1.5:9104",stack="db"}'
        values: '0x12'
      - series: 'mysql_global_variables_wsrep_desync{job="db_mariadb-galera-exporter-2",instance="10.0.1.6:9104",stack="db"}'
        values: '0x12'
      - series: 'mysql_global_variables_wsrep_desync{job="db_mariadb-galera-exporter-3",instance="10.0.1.7:9104",stack="db"}'
        values: '0x12'
      - series: 'mysql_global_variables_wsrep_desync{job="db_mariadb-galera-exporter-4",instance="10.0.1.8:9104",stack="db"}'
        values: '1x12'
      - series: 'mysql_global_status_wsrep_local_recv_queue{job="db_mariadb-galera-exporter-2",instance="10.0.1.6:9104",stack="db"}'
        values: '150x12'
      - series: 'mysql_global_status_wsrep_local_recv_queue{job="db_mariadb-galera-exporter-3",instance="10.0.1.7:9104",stack="db"}'
        values: '150x12'
      # Cluster db drops from 3 members to 2 at 2m; cluster ok stays at 3.
      - series: 'mysql_global_status_wsrep_cluster_size{job="db_mariadb-galera-exporter-1",instance="10.0.1.5:9104",stack="db"}'
        values: '3 3 2x10'
      - series: 'mysql_global_status_wsrep_cluster_size{job="db_mariadb-galera-exporter-2",instance="10.0.1.6:9104",stack="db"}'
        values: '3 3 2x10'
      - series: 'mysql_global_status_wsrep_cluster_size{job="ok_mariadb-galera-exporter-1",instance="10.0.2.5:9104",stack="ok"}'
        values: '3x12'

    alert_rule_test:
      # Three minutes in, nothing has lasted the 5m `for` yet.
      - eval_time: 4m
        alertname: MySQLDown
        exp_alerts: []
      - eval_time: 4m
        alertname: GaleraQuorumAtRisk
        exp_alerts: []

      - eval_time: 10m
        alertname: MySQLDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: db_mariadb-galera-exporter-1
              instance: 10.0.1.5:9104
              stack: db
            exp_annotations:
              summary: 'db_mariadb-galera-exporter-1 cannot reach its MySQL server'
              description: 'mysqld_exporter db_mariadb-galera-exporter-1 on 10.0.1.5:9104 has not reached its server for 5 minutes.'
      - eval_time: 10m
        alertname: MySQLGaleraNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              job: db_mariadb-galera-exporter-1
              instance: 10.0.1.5:9104
              stack: db
            exp_annotations:
              summary: 'Galera peer db_mariadb-galera-exporter-1 is not ready'
              description: 'wsrep_ready has been OFF on db_mariadb-galera-exporter-1 for 5 minutes: the peer is outside the primary component and refuses queries.'
      # Joining fires; the donor, the Synced peer and the deliberately desynced one do not.
      - eval_time: 10m
        alertname: MySQLGaleraOutOfSync
        exp_alerts:
          - exp_labels:
              severity: warning
              job: db_mariadb-galera-exporter-1
              instance: 10.0.1.5:9104
              stack: db
            exp_annotations:
              summary: 'Galera peer db_mariadb-galera-exporter-1 is out of sync'
              description: 'wsrep_local_state on db_mariadb-galera-exporter-1 has been 1 for 5 minutes, neither Synced (4) nor Donor (2).'
      # Only the donor: peer 3's queue is as long, but it is Synced.
      - eval_time: 10m
        alertname: MySQLGaleraDonorFallingBehind
        exp_alerts:
          - exp_labels:
              severity: warning
              job: db_mariadb-galera-exporter-2
              instance: 10.0.1.6:9104
              stack: db
            exp_annotations:
              summary: 'Galera donor db_mariadb-galera-exporter-2 is falling behind'
              description: 'db_mariadb-galera-exporter-2 is donating a state transfer and its receive queue has stayed above 100 write sets for 5 minutes.'
      # One alert per cluster, not one per surviving peer, and none for cluster ok.
      - eval_time: 10m
        alertname: GaleraQuorumAtRisk
        exp_alerts:
          - exp_labels:
              severity: critical
              stack: db
            exp_annotations:
              summary: 'Galera cluster db has 2 member(s)'
              description: 'Cluster db has been down to 2 member(s) for 5 minutes: one more failure loses quorum and every peer stops serving.'
      - eval_time: 10m
        alertname: GaleraClusterShrunk
        exp_alerts:
          - exp_labels:
              severity: warning
              stack: db
            exp_annotations:
              summary: 'Galera cluster db lost a member'
              description: 'Cluster db has 2 member(s), fewer than it had in the last day.'
