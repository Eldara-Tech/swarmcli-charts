# External resources this chart needs. Authoritative: every external network/secret/config
# the rendered stack references must be listed here (swarmcli pre-flights it; CI enforces it
# via scripts/requirements-check.sh). swarmcli renders this file with the release's values,
# so the templated names below track any override.
#
# This file sticks to plain YAML with value substitution only, every substitution quoted so it
# parses unrendered — not because control flow is impossible (swarmcli renders this file, and
# charts/zammad does `range` over a user-supplied list), but because a file that stays
# parseable unrendered is one yamllint can still check. A chart that genuinely needs `range`
# opts out with `# yamllint disable-file`; this one does not need it.
# Entries are declared unconditionally, with a fallback name
# so none can render empty: an entry a given configuration does not use — the github.com
# token on the GitHub platform, the config object when configName is unset — is simply never
# referenced by the manifest, and swarmcli's pre-flight is manifest-driven, so it stays inert.
#
# Renovate needs NO overlay network: it only makes outbound HTTPS calls. It needs no Docker
# socket either, which is why this chart carries no swarmcli-charts/allow annotation.
networks: []
secrets:
  - name: "{{ .Values.auth.tokenSecret }}"
    description: "Renovate's platform token — a PAT, or a GitHub App installation token. Pre-create: docker secret create renovate_token - (paste the token, then Ctrl-D)"
  - name: "{{ .Values.auth.githubComTokenSecret | default `github_com_token` }}"
    description: "NON-GitHub platforms only (auth.githubComTokenSecret). Renovate fetches release notes and any github>-hosted preset from github.com; unauthenticated those calls get rate-limited, so changelogs vanish and a github> preset can fail to resolve. A read-only, no-scope token fixes both. Pre-create: docker secret create github_com_token -"
configs:
  - name: "{{ .Values.configName | default `renovate_config` }}{{ with .Values.configVersion }}_{{ . }}{{ end }}"
    description: "Renovate's own config file (configName, suffixed with configVersion when set), mounted at /run/configs/renovate-config.{{ .Values.configFormat }} — the escape hatch for anything the chart values do not cover. The extension comes from configFormat and is the only thing telling Renovate how to parse the file. A Swarm config is immutable, so changed contents need a new configVersion and a new object. Pre-create: docker config create <the name above> ./config.json"
